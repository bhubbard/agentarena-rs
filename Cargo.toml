[workspace]
members = [
    "crates/agentarena-core",
    "crates/agentarena-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AgentArena Contributors", "Brandon Hubbard <bhubbard@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/bhubbard/agentarena-rs"
homepage = "https://code.brandonhubbard.com/agentarena-rs/"
documentation = "https://code.brandonhubbard.com/agentarena-rs/"
readme = "README.md"
keywords = ["ai-benchmark", "agent-evaluation", "simulation", "traffic", "tactical-ai"]
categories = ["science", "command-line-utilities", "simulation"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
indicatif = "0.17"
rand = "0.8"
tempfile = "3.12"
